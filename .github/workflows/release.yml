name: Release

# 版本号变化（tag v* 推送）时：构建镜像 → 发布 GHCR → 部署到服务器
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  IMAGE: ghcr.io/byboycn/dsp-web

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=${{ github.ref_name }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public
        continue-on-error: true
        run: |
          curl -s -X PATCH \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/user/packages/container/dsp-web \
            -d '{"visibility":"public"}' || true

  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    environment: production
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            IMAGE=${{ env.IMAGE }}:${{ github.ref_name }}
            docker pull $IMAGE
            docker rm -f dsp-web 2>/dev/null || true
            docker run -d --name dsp-web --restart unless-stopped \
              -p 172.17.0.1:7790:8080 $IMAGE
            docker image prune -f
            docker ps | grep dsp-web
            code=000
            for i in 1 2 3 4 5 6 7 8; do
              sleep 3
              code=$(curl -s -o /dev/null -w '%{http_code}' http://172.17.0.1:7790/ || true)
              [ "$code" = "200" ] && break
            done
            echo "health:$code"
            [ "$code" = "200" ]
