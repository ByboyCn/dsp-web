<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>星球矿工 · 游戏后台</title>
  <style>
    body { margin: 0; background: #14161c; color: #dfe3ea; font-family: "Segoe UI", sans-serif; padding: 20px; }
    h1 { font-size: 20px; }
    h2 { font-size: 16px; margin: 0 0 4px; }
    input, select { padding: 5px 8px; background: #1a1f2a; color: #dfe3ea; border: 1px solid #334; border-radius: 6px; font-size: 13px; }
    input[type=color] { padding: 1px; width: 40px; height: 28px; }
    input[type=number] { width: 70px; }
    textarea { background: #1a1f2a; color: #dfe3ea; border: 1px solid #334; border-radius: 6px; font-size: 12px; }
    button { padding: 6px 14px; background: #e06428; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    button.gray { background: #2a2e38; }
    button.del { background: #3a1e1e; color: #ff8888; }
    .card { background: #12161f; border: 1px solid #334; border-radius: 10px; padding: 16px; margin-bottom: 16px; max-width: 1200px; }
    .row { display: flex; gap: 10px; align-items: center; margin: 8px 0; flex-wrap: wrap; }
    .ok { color: #7ee787; } .err { color: #ff7777; }
    .entry { background: #1a1f2a; border: 1px solid #2a3040; border-radius: 8px; padding: 10px 12px; margin: 8px 0; }
    .fld { display: flex; flex-direction: column; gap: 2px; }
    .fld label { font-size: 11px; color: #8892a2; }
    .fld input, .fld select { min-width: 90px; }
    .fld.wide input, .fld.wide select { min-width: 260px; }
    .head { display: flex; align-items: center; gap: 10px; justify-content: space-between; border-bottom: 1px solid #2a3040; padding-bottom: 6px; margin-bottom: 6px; }
    .hint { font-size: 11px; color: #78808e; }
  </style>
</head>
<body>
  <h1>🛠 星球矿工 · 游戏后台</h1>

  <div class="card" id="loginCard">
    <div class="row">
      <label>管理员密码</label>
      <input id="pass" type="password" placeholder="默认 admin123，可在服务器 data/admin.json 修改" />
      <button onclick="login()">登录</button>
      <span id="loginMsg"></span>
    </div>
  </div>

  <div id="editor" style="display:none"></div>

  <script>
    let token = ''
    const $ = id => document.getElementById(id)

    // ---------- 字段模式定义 ----------
    const SECTIONS = [
      {
        key: 'quests', title: '📋 任务', addDef: () => ({ id: 'q' + Date.now(), name: '新任务', desc: '', metric: 'collect', item: '', target: 5, reward: { 16: 2 } }),
        fields: [
          { k: 'id', label: 'ID', t: 'text', req: 1 },
          { k: 'name', label: '名称', t: 'text', req: 1 },
          { k: 'desc', label: '描述', t: 'text', wide: 1 },
          { k: 'metric', label: '完成条件', t: 'select', opts: [['collect', '背包采集总数'], ['place', '放置建筑(item=类型)'], ['produce', '累计产出(item=物品id)'], ['store', '仓库+背包存量(item=物品id)'], ['inventory', '背包数量(item=物品id)'], ['tech', '已研究科技(item=科技id)']] },
          { k: 'item', label: '关联对象', t: 'text', hint: '按完成条件填：建筑类型 / 物品id / 科技id' },
          { k: 'target', label: '目标数量', t: 'num', def: 1 },
          { k: 'reward', label: '奖励(物品id:数量)', t: 'obj', hint: '如 16:2 多个用逗号 16:2,17:1' },
        ],
      },
      {
        key: 'techs', title: '🔬 科技', addDef: () => ({ id: 't' + Date.now(), name: '新科技', desc: '', cost: { 16: 10 }, time: 30, requires: '', unlocks: '' }),
        fields: [
          { k: 'id', label: 'ID', t: 'text', req: 1 },
          { k: 'name', label: '名称', t: 'text', req: 1 },
          { k: 'desc', label: '描述', t: 'text', wide: 1 },
          { k: 'cost', label: '研究消耗(物品id:数量)', t: 'obj', hint: '如 16:30' },
          { k: 'time', label: '研究耗时(秒)', t: 'num', def: 30 },
          { k: 'requires', label: '前置科技ID', t: 'text', hint: '留空=无前置' },
          { k: 'unlocks', label: '解锁目标', t: 'text', hint: '建筑类型(如 WindTurbine) 或 配方(如 recipe:a4)，留空=纯数值' },
        ],
      },
      {
        key: 'upgrades', title: '⬆ 升级', addDef: () => ({ id: 'u' + Date.now(), name: '新升级', desc: '', max: 6, base: { 16: 10 }, multKey: 'mine', per: 1.15 }),
        fields: [
          { k: 'id', label: 'ID', t: 'text', req: 1 },
          { k: 'name', label: '名称', t: 'text', req: 1 },
          { k: 'desc', label: '描述', t: 'text', wide: 1 },
          { k: 'max', label: '最高等级', t: 'num', def: 6 },
          { k: 'base', label: '一级费用(物品id:数量)', t: 'obj', hint: '每级费用 ×2' },
          { k: 'multKey', label: '效果对象', t: 'select', opts: [['mine', '采矿速度'], ['belt', '传送带速度'], ['smelt', '冶炼速度'], ['assemble', '制造速度'], ['mecha', '机甲移速']] },
          { k: 'per', label: '每级倍率', t: 'num', def: 1.15 },
        ],
      },
      {
        key: 'buildings', title: '🏗 建筑', addDef: () => ({ type: 'Custom' + Date.now(), name: '新建筑', desc: '', color: '#8a8f98', tech: '', powerDemand: 0, supply: 0, radius: 5, buildItem: 0, cost: {} }),
        fields: [
          { k: 'type', label: '类型ID', t: 'text', req: 1, hint: '已知类型有专属 3D 外观，未知类型按装饰建筑渲染' },
          { k: 'name', label: '名称(带表情前缀)', t: 'text', req: 1 },
          { k: 'desc', label: '描述', t: 'text', wide: 1 },
          { k: 'color', label: '颜色', t: 'color' },
          { k: 'tech', label: '解锁科技ID', t: 'text', hint: '留空=初始可用' },
          { k: 'powerDemand', label: '耗电', t: 'num', def: 0 },
          { k: 'supply', label: '供电', t: 'num', def: 0, hint: '发电建筑填，非发电填 0' },
          { k: 'radius', label: '电网覆盖半径', t: 'num', def: 5, hint: '发电/输电建筑填，其它填 0' },
          { k: 'fuelItem', label: '燃料物品id', t: 'num', hint: '如火电厂填 6(煤)，其它 0' },
          { k: 'fuelRate', label: '燃料消耗/秒', t: 'num', def: 0.5 },
          { k: 'buildItem', label: '手搓产物物品id', t: 'num', def: 0 },
          { k: 'cost', label: '手搓配方(物品id:数量)', t: 'obj' },
        ],
      },
    ]
    const KNOWN = ['Miner', 'Smelter', 'Assembler', 'Belt', 'Storage', 'WindTurbine', 'PowerPylon', 'Substation', 'ThermalPowerPlant', 'SolarPanel']

    const state = {}

    // ---------- 工具 ----------
    const parseObj = s => { const o = {}; for (const part of (s || '').split(',')) { const [k, v] = part.split(':').map(x => x.trim()); if (k) o[k] = parseFloat(v) || 0 } return o }
    const serObj = o => Object.entries(o || {}).map(([k, v]) => `${k}:${v}`).join(',')

    async function login() {
      const r = await (await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ pass: $('pass').value }) })).json()
      $('loginMsg').textContent = r.ok ? '✔ 已登录' : r.msg
      $('loginMsg').className = r.ok ? 'ok' : 'err'
      if (r.ok) {
        token = r.token
        $('loginCard').style.display = 'none'
        $('editor').style.display = 'block' // 显示编辑区（此前漏了这行导致登录后一片黑）
        await load()
      }
    }

    async function load() {
      const d = await (await fetch('/api/design')).json()
      for (const s of SECTIONS) { state[s.key] = d[s.key] || []; renderSection(s) }
      renderIcons(d.buildings || [])
    }

    // ---------- 表单渲染 ----------
    function fldInput(s, e, f) {
      const wrap = document.createElement('div'); wrap.className = 'fld' + (f.wide ? ' wide' : '')
      const lab = document.createElement('label'); lab.textContent = f.label + (f.req ? ' *' : ''); wrap.appendChild(lab)
      let inp
      if (f.t === 'select') {
        inp = document.createElement('select')
        for (const [v, n] of f.opts) { const o = document.createElement('option'); o.value = v; o.textContent = n; inp.appendChild(o) }
        inp.value = e[f.k] ?? f.opts[0][0]
      } else if (f.t === 'color') {
        inp = document.createElement('input'); inp.type = 'color'; inp.value = e[f.k] || '#8a8f98'
      } else {
        inp = document.createElement('input'); inp.type = 'text'
        inp.value = f.t === 'num' ? (e[f.k] ?? f.def ?? 0) : f.t === 'obj' ? serObj(e[f.k]) : (e[f.k] ?? '')
      }
      if (f.hint) { lab.textContent += ` ⓘ`; lab.title = f.hint }
      inp.oninput = () => {
        if (f.t === 'num') e[f.k] = parseFloat(inp.value) || 0
        else if (f.t === 'obj') e[f.k] = parseObj(inp.value)
        else e[f.k] = inp.value
      }
      wrap.appendChild(inp)
      return wrap
    }

    function entryCard(s, e, i) {
      const card = document.createElement('div'); card.className = 'entry'
      const head = document.createElement('div'); head.className = 'head'
      const no = document.createElement('b'); no.textContent = `#${i + 1}`
      head.appendChild(no)
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '🗑 删除'
      del.onclick = () => { state[s.key].splice(i, 1); renderSection(s) }
      head.appendChild(del)
      card.appendChild(head)
      const row = document.createElement('div'); row.className = 'row'
      for (const f of s.fields) row.appendChild(fldInput(s, e, f))
      card.appendChild(row)
      return card
    }

    function renderSection(s) {
      const box = $('sec_' + s.key)
      box.innerHTML = ''
      const head = document.createElement('div'); head.className = 'row'
      const t = document.createElement('h2'); t.textContent = s.title + `（${state[s.key].length}）`; head.appendChild(t)
      const add = document.createElement('button'); add.textContent = '➕ 添加'
      add.onclick = () => { state[s.key].push(s.addDef()); renderSection(s) }
      head.appendChild(add)
      const save = document.createElement('button'); save.textContent = '💾 保存' + s.title.slice(2)
      save.onclick = () => saveSection(s)
      head.appendChild(save)
      const msg = document.createElement('span'); msg.id = 'msg_' + s.key; head.appendChild(msg)
      box.appendChild(head)
      state[s.key].forEach((e, i) => box.appendChild(entryCard(s, e, i)))
    }

    async function saveSection(s) {
      const design = {}
      for (const sec of SECTIONS) design[sec.key] = state[sec.key]
      const r = await (await fetch('/api/admin/design', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, design: JSON.stringify(design) }) })).json()
      const el = $('msg_' + s.key)
      el.textContent = r.ok ? '✔ 已保存，玩家刷新页面生效' : r.msg
      el.className = r.ok ? 'ok' : 'err'
    }

    // ---------- 图标上传 ----------
    async function load() {
      const d = await (await fetch('/api/design')).json()
      for (const s of SECTIONS) { state[s.key] = d[s.key] || []; renderSection(s) }
      renderIcons(d.buildings || [])
    }

    function renderIcons(buildings) {
      const el = $('iconList'); el.innerHTML = ''
      const iconOf = {}
      for (const b of buildings) if (b.type && b.icon) iconOf[b.type] = b.icon
      for (const t of KNOWN) {
        const row = document.createElement('div'); row.className = 'row'
        const icon = iconOf[t]
        row.innerHTML = (icon ? `<img src="${icon}" style="width:28px;height:28px;border-radius:4px">` : '<span style="width:28px;text-align:center;color:#556">—</span>')
          + `<span style="flex:1">${t}</span>`
        const inp = document.createElement('input')
        inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none'; inp.id = 'icon_' + t
        inp.onchange = () => uploadIcon(t, inp)
        const up = document.createElement('button'); up.textContent = '上传'; up.className = 'gray'
        up.onclick = () => inp.click()
        row.appendChild(inp); row.appendChild(up)
        if (icon) { const c = document.createElement('button'); c.textContent = '还原默认'; c.className = 'gray'; c.onclick = () => clearIcon(t); row.appendChild(c) }
        const st = document.createElement('span'); st.id = 'm-icon_' + t; row.appendChild(st)
        el.appendChild(row)
      }
    }

    async function uploadIcon(t, inp) {
      const f = inp.files[0]
      if (!f) return
      const rd = new FileReader()
      rd.onload = async () => {
        const r = await (await fetch('/api/admin/upload-icon', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, type: t, dataUrl: rd.result }) })).json()
        $('m-icon_' + t).textContent = r.ok ? '✔ 已上传，玩家刷新生效' : r.msg
        $('m-icon_' + t).className = r.ok ? 'ok' : 'err'
        if (r.ok) setTimeout(load, 800)
      }
      rd.readAsDataURL(f)
    }

    async function clearIcon(t) {
      await fetch('/api/admin/clear-icon', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, type: t }) })
      load()
    }

    // ---------- 初始化编辑器框架 ----------
    fetch('/api/design').then(async () => {
      const ed = $('editor')
      for (const s of SECTIONS) {
        const card = document.createElement('div'); card.className = 'card'
        const box = document.createElement('div'); box.id = 'sec_' + s.key
        card.appendChild(box)
        ed.appendChild(card)
      }
      const iconCard = document.createElement('div'); iconCard.className = 'card'
      iconCard.innerHTML = '<b>🎨 建筑图标上传</b><span style="color:#889;font-size:12px">（全服生效：替换建造栏图标与建筑 3D 贴图）</span><div id="iconList" style="margin-top:8px"></div>'
      ed.appendChild(iconCard)
    })
  </script>
</body>
</html>
